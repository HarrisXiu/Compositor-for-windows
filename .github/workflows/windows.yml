name: Windows C++
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt development libraries
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.10.2 win64_msvc2022_64 --outputdir .cache/Qt --archives qtbase qtsvg --modules qtimageformats
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build, test and package
        shell: pwsh
        run: ./windows/build.ps1 -Package
      - uses: actions/upload-artifact@v7
        with:
          name: Compositor-Windows-x64
          path: artifacts/Compositor-Windows-x64.zip
